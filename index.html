-webkit-mask-repeat:no-repeat;
mask-repeat:no-repeat;
-webkit-mask-position:90% 0;
mask-position:90% 0;

@keyframes shine{
0%{opacity:1;-webkit-mask-position:90% 0;mask-position:90% 0}

.body{

.wing-l{

35%{transform:perspective(900px) rotateY(-10deg);animation-timing-function:cubic-bezier(.55,0,.9,.35)}

58%{transform:perspective(900px) rotateY(112deg);animation-timing-function:cubic-bezier(.35,0,.25,1)}
100%{transform:perspective(900px) rotateY(0deg)}

@keyframes clapR{

.spiral-line{

<script>

var sp=document.getElementById('splash');

function hideSplash(){

if(sp.classList.contains('hide')) return;

sp.classList.add('hide');

}

try{
sessionStorage.setItem('vaaSplash','1');
}catch(e){}

var t=setTimeout(hideSplash,2500);

sp.addEventListener('click',function(){
clearTimeout(t);
hideSplash();
});

const innerText="From Our Imagination to Yours.";

let ii=0;

function typeInner(){

if(ii<=innerText.length){

document.getElementById('innerType').textContent=
innerText.substring(0,ii);

ii++;

setTimeout(typeInner,85);

}

}

setTimeout(typeInner,3000);

function harperVibe(el){

if(navigator.vibrate){
navigator.vibrate([30,20,30]);
}

el.classList.add('vibrate');

setTimeout(()=>{
el.classList.remove('vibrate');
},400);

}

/* SINGLE WHITE LIGHT + AURA SPIRAL - PLAY ONCE */

function triggerAuraTrail(){

const trail=document.getElementById('auraTrail');

if(!trail || trail.dataset.played==="true") return;

trail.dataset.played="true";
trail.classList.add('animate');

const motion=document.getElementById('auraMotion');

if(motion){
motion.beginElement();
}

}

/* WAIT FOR PAGE LOAD AND SPLASH SCREEN TO FINISH */

let auraPageLoaded=false;
let auraSplashFinished=
document.documentElement.classList.contains('seen') ||
sp.classList.contains('hide');

let auraStarted=false;

function tryStartAura(){

if(!auraPageLoaded || !auraSplashFinished || auraStarted){
return;
}

auraStarted=true;

setTimeout(function(){
triggerAuraTrail();
},600);

}

/* Detect when splash screen has completely disappeared */

sp.addEventListener('transitionend',function(e){

if(e.propertyName==='opacity'){

auraSplashFinished=true;
tryStartAura();

}

});

/* Wait until all page resources are loaded */

window.addEventListener('load',function(){

auraPageLoaded=true;

if(
document.documentElement.classList.contains('seen') ||
sp.classList.contains('hide')
){
auraSplashFinished=true;
}

tryStartAura();

});

</script>
