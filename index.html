*{margin:0;padding:0;box-sizing:border-box}

body{
background:#000;
color:#fff;
font-family:'Inter',sans-serif;
min-height:100vh;

body::before{
content:'';

.splash{
position:fixed;
inset:0;
background:#000;
z-index:9999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
overflow:hidden;
cursor:pointer;
transition:opacity 0.5s ease,visibility 0s linear 0.5s
}

.seen .splash{display:none}

.splash.hide{
opacity:0;
visibility:hidden;
pointer-events:none
}

.logo{
position:relative;
width:min(98vw,700px);
aspect-ratio:1400/707;
animation:logoIn 0.6s ease-out both,flash 1.2s linear 0.8s 1
}

.logo img{
position:absolute;
inset:0;
width:100%;
height:100%;
mix-blend-mode:screen;
pointer-events:none
}

.txtwrap{
position:absolute;
inset:0;
clip-path:inset(34% 37% 27% 38%);
mix-blend-mode:screen;
pointer-events:none
}

.logo .txtwrap img{
mix-blend-mode:normal;
filter:brightness(3) contrast(1.1);
-webkit-mask-image:linear-gradient(105deg,transparent 35%,#000 50%,transparent 65%);
mask-image:linear-gradient(105deg,transparent 35%,#000 50%,transparent 65%);
-webkit-mask-size:300% 100%;
mask-size:300% 100%;
-webkit-mask-repeat:no-repeat;
mask-repeat:no-repeat;
-webkit-mask-position:90% 0;
mask-position:90% 0;
opacity:0;
animation:shine 0.9s ease-in-out 0.5s 1 both
}

@keyframes shine{
0%{opacity:1;-webkit-mask-position:90% 0;mask-position:90% 0}
100%{opacity:1;-webkit-mask-position:15% 0;mask-position:15% 0}
}

.body{
position:absolute;
inset:0;
animation:pulse 1.2s ease-in-out 0.8s 1
}

.wing-l{
transform-origin:33% 54%;
animation:clapL 1.2s linear 0.8s 1
}

.wing-r{
transform-origin:67.5% 54%;
animation:clapR 1.2s linear 0.8s 1
}

@keyframes clapL{
0%{transform:perspective(900px) rotateY(0deg);animation-timing-function:cubic-bezier(.4,0,.3,1)}
35%{transform:perspective(900px) rotateY(-10deg);animation-timing-function:cubic-bezier(.55,0,.9,.35)}
52%{transform:perspective(900px) rotateY(120deg);animation-timing-function:ease-out}
58%{transform:perspective(900px) rotateY(112deg);animation-timing-function:cubic-bezier(.35,0,.25,1)}
100%{transform:perspective(900px) rotateY(0deg)}
}

@keyframes clapR{
0%{transform:perspective(900px) rotateY(0deg);animation-timing-function:cubic-bezier(.4,0,.3,1)}
35%{transform:perspective(900px) rotateY(10deg);animation-timing-function:cubic-bezier(.55,0,.9,.35)}
52%{transform:perspective(900px) rotateY(-120deg);animation-timing-function:ease-out}
58%{transform:perspective(900px) rotateY(-112deg);animation-timing-function:cubic-bezier(.35,0,.25,1)}
100%{transform:perspective(900px) rotateY(0deg)}
}

@keyframes pulse{
0%,45%{transform:scale(1)}
52%{transform:scale(1.03)}
62%,100%{transform:scale(1)}

@keyframes flash{

/* AURA LIGHT TRAIL */

.aura-trail{
position:absolute;
left:0;
top:0;
width:100%;
height:270px;
pointer-events:none;
z-index:8;
overflow:visible
}

/* Straight white-blue beam */

.aura-beam{
fill:none;
stroke:url(#beamGradient);
stroke-width:2.2;
stroke-linecap:round;
filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 7px #00bfff);
stroke-dasharray:145;
stroke-dashoffset:145;
opacity:0
}

/* Curved colourful trail through the A */

.aura-curve{
fill:none;
stroke:url(#trailGradient);
stroke-width:3;
stroke-linecap:round;
stroke-linejoin:round;
filter:
drop-shadow(0 0 4px #00bfff)
drop-shadow(0 0 8px #8a2be2)
drop-shadow(0 0 11px #ff6a00);
stroke-dasharray:190;
stroke-dashoffset:190;
opacity:0
}

/* White stars */

.aura-top-star,
.aura-bottom-star{
fill:#fff;
filter:
drop-shadow(0 0 3px #fff)
drop-shadow(0 0 8px #00cfff)
drop-shadow(0 0 13px #8a2be2);
opacity:0
}

.aura-top-star{transform-origin:210px 3px}
.aura-bottom-star{transform-origin:210px 252px}

/* Animation sequence */

.aura-trail.animate .aura-beam{
animation:beamReveal 1.25s ease-out .15s 1 forwards
}

.aura-trail.animate .aura-curve{
animation:curveReveal 2.15s ease-in-out 1.05s 1 forwards
}

.aura-trail.animate .aura-top-star{
animation:topStarGlow 3.1s ease-in-out .1s 1 forwards
}

.aura-trail.animate .aura-bottom-star{
animation:bottomStarGlow 1.1s ease-out 2.75s 1 forwards
}

@keyframes beamReveal{
0%{stroke-dashoffset:145;opacity:0}
12%{opacity:1}
78%{stroke-dashoffset:0;opacity:1}
100%{stroke-dashoffset:0;opacity:.85}
}

@keyframes curveReveal{
0%{stroke-dashoffset:190;opacity:0}
12%{opacity:1}
82%{stroke-dashoffset:0;opacity:1}
100%{stroke-dashoffset:0;opacity:0}
}

@keyframes topStarGlow{
0%{opacity:0;transform:scale(.5)}
12%{opacity:1;transform:scale(1.1)}
30%,75%{opacity:1;transform:scale(1)}
100%{opacity:0;transform:scale(.65)}
}

@keyframes bottomStarGlow{
0%{opacity:0;transform:scale(.5)}
35%{opacity:1;transform:scale(1.25)}
65%{opacity:1;transform:scale(1)}
100%{opacity:0;transform:scale(.55)}
}

<script>

var sp=document.getElementById('splash');

function hideSplash(){

if(sp.classList.contains('hide')) return;

sp.classList.add('hide');

triggerAuraTrail();

}

try{
sessionStorage.setItem('vaaSplash','1');
}catch(e){}

var t=setTimeout(hideSplash,2500);

sp.addEventListener('click',function(){
clearTimeout(t);
hideSplash();
});

const innerText="From Our Imagination to Yours.";

let ii=0;

function typeInner(){

if(ii<=innerText.length){

document.getElementById('innerType').textContent=
innerText.substring(0,ii);

ii++;

setTimeout(typeInner,85);

}

}

setTimeout(typeInner,3000);

function harperVibe(el){

if(navigator.vibrate){
navigator.vibrate([30,20,30]);
}

el.classList.add('vibrate');

setTimeout(()=>{
el.classList.remove('vibrate');
},400);

}

/* AURA LIGHT TRAIL TRIGGER */

function triggerAuraTrail(){

const trail=document.getElementById('auraTrail');

if(trail){

trail.classList.remove('animate');

void trail.getBoundingClientRect();

trail.classList.add('animate');

}

}

</script>
