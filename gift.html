<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIVIDGIFTS - Divine Gift Concierge | VIVID AURA ART</title>
<link rel="icon" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#000;
color:#fff;
font-family:'Inter',sans-serif;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
padding:20px 15px;
overflow-x:hidden
}

body::before{
content:'';
position:fixed;
inset:0;
background:radial-gradient(ellipse at top,#1a1025 0%,#000 60%);
z-index:-1
}

/* Back Button */
.back-btn{
position:absolute;
top:20px;
left:20px;
color:#c9a14a;
text-decoration:none;
font-size:24px;
z-index:10;
transition:transform 0.2s, color 0.2s;
}
.back-btn:active{transform:scale(0.9);color:#fff;}

.container{
position:relative;
width:100%;
max-width:420px;
display:flex;
flex-direction:column;
align-items:center;
margin-top:10px;
}

/* VIVIDGIFTS Logo & Rotating Light Animation */
.logo-wrap {
position: relative;
width: 130px;
height: 130px;
margin-bottom: 15px;
margin-top: 5px;
display: flex;
justify-content: center;
align-items: center;
}

/* Rotating Light Effect */
.logo-wrap::before {
content: '';
position: absolute;
inset: -4px;
border-radius: 50%;
background: conic-gradient(
from 0deg,
transparent 0deg,
transparent 270deg,
rgba(255, 255, 255, 0.2) 300deg,
#ffffff 345deg,
#ffffff 360deg
);
animation: rotateLight 3s linear infinite;
z-index: 1;
-webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
}

@keyframes rotateLight {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}

/* Soft Glow behind logo */
.logo-wrap::after {
content: '';
position: absolute;
inset: 0;
border-radius: 50%;
box-shadow: 0 0 20px rgba(155,107,255,0.3), inset 0 0 20px rgba(201,161,74,0.2);
z-index: 0;
pointer-events: none;
}

.gift-logo {
position: relative;
width: 100%;
height: 100%;
object-fit: contain;
z-index: 2;
border-radius: 50%;
background: #000;
}

/* Heading */
h1{
font-family:'Cinzel',serif;
font-size:32px;
text-align:center;
line-height:1.2;
color:#fff;
margin-bottom:12px;
z-index: 2;
}

h1 .highlight{
background:linear-gradient(110deg,#c9a14a,#9b6bff,#d46bff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
font-size:14px;
color:#aaa;
text-align:center;
line-height:1.6;
margin-bottom:25px;
padding:0 10px;
font-style:italic;
}

/* Main Magic Box */
.magic-box{
width:100%;
background:rgba(255,255,255,0.03);
border-radius:20px;
padding:2px;
background:linear-gradient(110deg,#c9a14a,#9b6bff,#d46bff);
box-shadow:0 0 25px rgba(155,107,255,0.25);
margin-bottom:24px;
}

.magic-inner{
background:#050508;
border-radius:18px;
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}

textarea{
width:100%;
background:transparent;
border:none;
color:#fff;
font-family:'Inter',sans-serif;
font-size:15px;
resize:none;
outline:none;
height:80px;
}

textarea::placeholder{color:#666;font-style:italic;}

/* Reveal Button */
.reveal-btn{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:linear-gradient(110deg,rgba(201,161,74,0.15),rgba(155,107,255,0.2));
border:1.5px solid rgba(201,161,74,0.6);
color:#e8c36a;
font-family:'Inter',sans-serif;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:0.3s;
box-shadow:0 0 10px rgba(201,161,74,0.15);
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.reveal-btn:active{
transform:scale(0.97);
box-shadow:0 0 25px rgba(212,107,255,0.5);
border-color:#d46bff;
color:#fff;
}

/* Quick Picks (Mystical tags) */
.quick-picks-label{
width:100%;
text-align:left;
font-size:11px;
color:#888;
letter-spacing:1.5px;
margin-bottom:12px;
font-weight:700;
}

.quick-picks{
display:flex;
flex-wrap:wrap;
gap:10px;
width:100%;
justify-content:flex-start;
margin-bottom:20px;
}

.chip{
padding:8px 14px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(201,161,74,0.2);
border-radius:50px;
font-size:12px;
color:#ccc;
cursor:pointer;
transition:0.2s;
}

.chip:active{
background:rgba(155,107,255,0.2);
border-color:#9b6bff;
color:#fff;
transform:scale(0.95);
}

/* Loading State */
.loader{
display:none;
text-align:center;
color:#e8c36a;
font-family:'Cinzel',serif;
font-size:14px;
letter-spacing:2px;
margin:20px 0;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%,100%{opacity:0.5;}
50%{opacity:1;}
}

/* Results Section */
.results-section{
display:none;
width:100%;
margin-top:10px;
animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(15px)}
to{opacity:1;transform:translateY(0)}
}

/* Product List Card Style */
.product-list-card {
    background: #0a0a0f;
    border: 1.5px solid rgba(201,161,74,0.3);
    border-radius: 16px;
    padding: 12px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    text-decoration: none;
    transition: 0.3s;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    gap: 12px;
}

.product-list-card:active {
    transform: scale(0.97);
    border-color: #ff9900;
    box-shadow: 0 0 15px rgba(255,153,0,0.3);
}

/* Image Style */
.product-img {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    object-fit: cover;
    background: #fff;
    border: 1px solid rgba(255,255,255,0.1);
    flex-shrink: 0;
}

.product-info {
    display: flex;
    flex-direction: column;
    flex-grow: 1;
    overflow: hidden;
}

.product-title {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.product-desc {
    font-size: 11px;
    color: #888;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.buy-btn-small {
    background: linear-gradient(110deg, rgba(255,153,0,0.15), rgba(255,153,0,0.05));
    border: 1px solid #ff9900;
    color: #ffcc00;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 5px;
    flex-shrink: 0;
}

/* Footer */
.footer{
margin-top:30px;
text-align:center;
opacity:0.3;
font-size:11px;
margin-bottom:20px;
}
</style>
</head>

<body>

<a href="index.html" class="back-btn">←</a>

<div class="container">

<!-- VIVIDGIFTS Logo with Rotating Light -->
<div class="logo-wrap">
    <img src="vividgifts-logo.png" alt="VIVIDGIFTS Logo" class="gift-logo">
</div>

<h1>Consult the <br><span class="highlight">Aura Oracle</span></h1>

<p class="subtitle">
"Describe their soul, their passions, their vibe. <br>Let our magic weave the perfect gift."
</p>

<div class="magic-box">
<div class="magic-inner">
<textarea id="giftInput" placeholder="e.g. 'Teddy bear', 'A gamer', 'Coffee mug'"></textarea>
<button class="reveal-btn" onclick="findGifts()">✨ Reveal Gifts</button>
</div>
</div>

<div class="quick-picks-label">QUICK SUMMONS:</div>
<div class="quick-picks">
<div class="chip" onclick="setQuickPick('Coffee Mug')">☕ Coffee Mug</div>
<div class="chip" onclick="setQuickPick('Gaming Mouse')">🎮 Gaming Mouse</div>
<div class="chip" onclick="setQuickPick('Teddy Bear')">🧸 Teddy Bear</div>
<div class="chip" onclick="setQuickPick('Scented Candle')">🕯️ Candle</div>
</div>

<!-- Loading Text -->
<div class="loader" id="loader">Channeling the Aura...</div>

<!-- Results Section -->
<div class="results-section" id="results">
</div>

</div>

<div class="footer">© 2026 VIVID AURA ART</div>

<script>
// Quick Pick handler
function setQuickPick(text) {
    document.getElementById('giftInput').value = text;
}

// The Real "Aura Oracle" Search Function
function findGifts() {
    const inputField = document.getElementById('giftInput');
    let searchQuery = inputField.value.trim();
    
    if(!searchQuery) {
        alert("Please describe what kind of gift you are looking for! ✨");
        return;
    }

    const resultsSection = document.getElementById('results');
    const loader = document.getElementById('loader');
    
    resultsSection.style.display = 'none';
    loader.style.display = 'block';
    
    const affiliateTag = "vividauraart-21";
    
    // Format the search term for Amazon
    const encodedQuery = encodeURIComponent(searchQuery);

    // We create 3 variations based on the exact word the user typed
    let productList = [
        { 
            title: searchQuery, 
            desc: `Best selling ${searchQuery} on Amazon.`, 
            // Use Unsplash (free image API) to get a related photo dynamically
            img: `https://source.unsplash.com/150x150/?${encodedQuery}`
        },
        { 
            title: `Premium ${searchQuery}`, 
            desc: `Top rated premium ${searchQuery} gifts.`, 
            img: `https://source.unsplash.com/150x150/?${encodedQuery},gift`
        },
        { 
            title: `${searchQuery} Gift Set`, 
            desc: `A curated collection of ${searchQuery}.`, 
            img: `https://source.unsplash.com/150x150/?${encodedQuery},box`
        },
        { 
            title: `Personalized ${searchQuery}`, 
            desc: `Custom made ${searchQuery} for your loved ones.`, 
            img: `https://source.unsplash.com/150x150/?${encodedQuery},custom`
        }
    ];

    setTimeout(() => {
        loader.style.display = 'none';
        
        let resultsHTML = `<div style="font-family:'Cinzel',serif; font-size:14px; color:#e8c36a; text-align:center; margin-bottom:15px; letter-spacing:1px;">Top Picks for "${searchQuery}"</div>`;

        productList.forEach(product => {
            // Create Amazon direct link
            const itemQuery = encodeURIComponent(product.title);
            const amazonLink = `https://www.amazon.in/s?k=${itemQuery}&tag=${affiliateTag}`;
            
            resultsHTML += `
                <a href="${amazonLink}" target="_blank" class="product-list-card">
                    <img src="${product.img}" class="product-img" alt="${product.title}" onerror="this.src='https://via.placeholder.com/150?text=Gift'">
                    <div class="product-info">
                        <div class="product-title">${product.title}</div>
                        <div class="product-desc">${product.desc}</div>
                    </div>
                    <div class="buy-btn-small">
                        Buy ➜
                    </div>
                </a>
            `;
        });

        resultsSection.innerHTML = resultsHTML;
        resultsSection.style.display = 'block';
        
        setTimeout(() => {
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
        
    }, 1000); 
}
</script>

</body>
</html>
