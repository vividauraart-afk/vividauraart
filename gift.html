<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VIVIDGIFTS - Divine Gift Concierge | VIVID AURA ART</title>
<link rel="icon" href="favicon.png">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@500;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#000;
color:#fff;
font-family:'Inter',sans-serif;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
padding:20px 15px;
overflow-x:hidden
}

body::before{
content:'';
position:fixed;
inset:0;
background:radial-gradient(ellipse at top,#1a1025 0%,#000 60%);
z-index:-1
}

/* Back Button */
.back-btn{
position:absolute;
top:20px;
left:20px;
color:#c9a14a;
text-decoration:none;
font-size:24px;
z-index:10;
transition:transform 0.2s, color 0.2s;
}
.back-btn:active{transform:scale(0.9);color:#fff;}

.container{
position:relative;
width:100%;
max-width:420px;
display:flex;
flex-direction:column;
align-items:center;
margin-top:10px;
}

/* VIVIDGIFTS Logo & Rotating Light Animation */
.logo-wrap {
position: relative;
width: 130px;
height: 130px;
margin-bottom: 15px;
margin-top: 5px;
display: flex;
justify-content: center;
align-items: center;
}

/* Rotating Light Effect */
.logo-wrap::before {
content: '';
position: absolute;
inset: -4px;
border-radius: 50%;
background: conic-gradient(
from 0deg,
transparent 0deg,
transparent 270deg,
rgba(255, 255, 255, 0.2) 300deg,
#ffffff 345deg,
#ffffff 360deg
);
animation: rotateLight 3s linear infinite;
z-index: 1;
-webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
}

@keyframes rotateLight {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}

/* Soft Glow behind logo */
.logo-wrap::after {
content: '';
position: absolute;
inset: 0;
border-radius: 50%;
box-shadow: 0 0 20px rgba(155,107,255,0.3), inset 0 0 20px rgba(201,161,74,0.2);
z-index: 0;
pointer-events: none;
}

.gift-logo {
position: relative;
width: 100%;
height: 100%;
object-fit: contain;
z-index: 2;
border-radius: 50%;
background: #000;
}

/* Heading */
h1{
font-family:'Cinzel',serif;
font-size:32px;
text-align:center;
line-height:1.2;
color:#fff;
margin-bottom:12px;
z-index: 2;
}

h1 .highlight{
background:linear-gradient(110deg,#c9a14a,#9b6bff,#d46bff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.subtitle{
font-size:14px;
color:#aaa;
text-align:center;
line-height:1.6;
margin-bottom:25px;
padding:0 10px;
font-style:italic;
}

/* Main Magic Box */
.magic-box{
width:100%;
background:rgba(255,255,255,0.03);
border-radius:20px;
padding:2px;
background:linear-gradient(110deg,#c9a14a,#9b6bff,#d46bff);
box-shadow:0 0 25px rgba(155,107,255,0.25);
margin-bottom:24px;
}

.magic-inner{
background:#050508;
border-radius:18px;
padding:20px;
display:flex;
flex-direction:column;
gap:15px;
}

textarea{
width:100%;
background:transparent;
border:none;
color:#fff;
font-family:'Inter',sans-serif;
font-size:15px;
resize:none;
outline:none;
height:80px;
}

textarea::placeholder{color:#666;font-style:italic;}

/* Reveal Button */
.reveal-btn{
width:100%;
padding:16px;
border:none;
border-radius:12px;
background:linear-gradient(110deg,rgba(201,161,74,0.15),rgba(155,107,255,0.2));
border:1.5px solid rgba(201,161,74,0.6);
color:#e8c36a;
font-family:'Inter',sans-serif;
font-size:15px;
font-weight:700;
cursor:pointer;
transition:0.3s;
box-shadow:0 0 10px rgba(201,161,74,0.15);
display:flex;
align-items:center;
justify-content:center;
gap:8px;
}

.reveal-btn:active{
transform:scale(0.97);
box-shadow:0 0 25px rgba(212,107,255,0.5);
border-color:#d46bff;
color:#fff;
}

/* Quick Picks (Mystical tags) */
.quick-picks-label{
width:100%;
text-align:left;
font-size:11px;
color:#888;
letter-spacing:1.5px;
margin-bottom:12px;
font-weight:700;
}

.quick-picks{
display:flex;
flex-wrap:wrap;
gap:10px;
width:100%;
justify-content:flex-start;
margin-bottom:20px;
}

.chip{
padding:8px 14px;
background:rgba(255,255,255,0.04);
border:1px solid rgba(201,161,74,0.2);
border-radius:50px;
font-size:12px;
color:#ccc;
cursor:pointer;
transition:0.2s;
}

.chip:active{
background:rgba(155,107,255,0.2);
border-color:#9b6bff;
color:#fff;
transform:scale(0.95);
}

/* Loading State */
.loader{
display:none;
text-align:center;
color:#e8c36a;
font-family:'Cinzel',serif;
font-size:14px;
letter-spacing:2px;
margin:20px 0;
animation:pulse 1.5s infinite;
}

@keyframes pulse{
0%,100%{opacity:0.5;}
50%{opacity:1;}
}

/* Results Section */
.results-section{
display:none;
width:100%;
margin-top:10px;
animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(15px)}
to{opacity:1;transform:translateY(0)}
}

.result-card{
background:linear-gradient(rgba(20,10,30,0.8),rgba(10,5,15,0.8)) padding-box,
linear-gradient(110deg,#c9a14a,#9b6bff,#d46bff) border-box;
border:1.5px solid transparent;
border-radius:16px;
padding:22px;
margin-bottom:14px;
box-shadow:0 5px 15px rgba(0,0,0,0.5);
}

.result-card h3{
font-family:'Cinzel',serif;
background:linear-gradient(110deg,#e8c36a,#d46bff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
font-size:16px;
margin-bottom:10px;
}

.result-card p{
font-size:13px;
color:#bbb;
line-height:1.5;
}

/* Footer */
.footer{
margin-top:30px;
text-align:center;
opacity:0.3;
font-size:11px;
margin-bottom:20px;
}
</style>
</head>

<body>

<a href="index.html" class="back-btn">←</a>

<div class="container">

<!-- VIVIDGIFTS Logo with Rotating Light -->
<div class="logo-wrap">
    <img src="vividgifts-logo.png" alt="VIVIDGIFTS Logo" class="gift-logo">
</div>

<h1>Consult the <br><span class="highlight">Aura Oracle</span></h1>

<p class="subtitle">
"Describe their soul, their passions, their vibe. <br>Let our magic weave the perfect gift."
</p>

<div class="magic-box">
<div class="magic-inner">
<textarea id="giftInput" placeholder="e.g. 'A gamer who loves dark fantasy and late-night coffee'"></textarea>
<button class="reveal-btn" onclick="findGifts()">✨ Reveal Gifts</button>
</div>
</div>

<div class="quick-picks-label">QUICK SUMMONS:</div>
<div class="quick-picks">
<div class="chip" onclick="setQuickPick('The Coffee Snob ☕')">☕ The Coffee Snob</div>
<div class="chip" onclick="setQuickPick('The Hardcore Gamer 🎮')">🎮 The Gamer</div>
<div class="chip" onclick="setQuickPick('The Dark Fantasy Lover 🦇')">🦇 Fantasy Lover</div>
<div class="chip" onclick="setQuickPick('The Divine Soul 🕉️')">🕉️ Divine Soul</div>
</div>

<!-- Loading Text -->
<div class="loader" id="loader">Channeling the Aura...</div>

<!-- Results Section -->
<div class="results-section" id="results">
</div>

</div>

<div class="footer">© 2026 VIVID AURA ART</div>

<script>
// Quick Pick handler
function setQuickPick(text) {
    document.getElementById('giftInput').value = text;
}

// The Real "Aura Oracle" Search Function
function findGifts() {
    const inputField = document.getElementById('giftInput');
    const searchQuery = inputField.value.trim();
    
    // Empty fallback
    if(!searchQuery) {
        alert("Please describe what kind of gift you are looking for! ✨");
        return;
    }

    const resultsSection = document.getElementById('results');
    const loader = document.getElementById('loader');
    
    // Hide old results, show loader
    resultsSection.style.display = 'none';
    loader.style.display = 'block';
    
    // Fake AI loading effect (1 second)
    setTimeout(() => {
        loader.style.display = 'none';
        
        // Create Amazon Search Links with your Associate ID
        const encodedQuery = encodeURIComponent(searchQuery);
        
        // YOUR AMAZON AFFILIATE TAG
        const affiliateTag = "vividauraart-21"; 
        
        // Amazon India search link with Affiliate Tag
        const amazonLink = `https://www.amazon.in/s?k=${encodedQuery}+gift&tag=${affiliateTag}`;
        // Amazon Global link with Affiliate Tag
        const amazonGlobalLink = `https://www.amazon.com/s?k=${encodedQuery}+gift&tag=${affiliateTag}`;

        // Display the cards with links
        let resultsHTML = `
            <div class="result-card" style="border: 1.5px solid #ff9900; background: linear-gradient(rgba(255,153,0,0.1), rgba(10,5,15,0.8)) padding-box;">
                <h3 style="background: linear-gradient(110deg,#ff9900,#ffcc00); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">🛒 Search on Amazon (India)</h3>
                <p>Click below to instantly find the perfect <b>"${searchQuery}"</b> gifts on Amazon India.</p>
                <a href="${amazonLink}" target="_blank" class="reveal-btn" style="text-decoration:none; margin-top:15px; display:inline-flex; justify-content:center; border-color:#ff9900; color:#ffcc00;">
                    Buy on Amazon.in ➜
                </a>
            </div>

            <div class="result-card" style="border: 1.5px solid #00a8e1; background: linear-gradient(rgba(0,168,225,0.1), rgba(10,5,15,0.8)) padding-box;">
                <h3 style="background: linear-gradient(110deg,#00a8e1,#ffffff); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">🌍 Search on Amazon (Global)</h3>
                <p>Looking for international brands? Search the global Amazon store for <b>"${searchQuery}"</b>.</p>
                <a href="${amazonGlobalLink}" target="_blank" class="reveal-btn" style="text-decoration:none; margin-top:15px; display:inline-flex; justify-content:center; border-color:#00a8e1; color:#00a8e1;">
                    Buy on Amazon.com ➜
                </a>
            </div>
            
            <div class="result-card" style="border: 1.5px solid #c9a14a; background: linear-gradient(rgba(201,161,74,0.1), rgba(10,5,15,0.8)) padding-box;">
                <h3 style="background: linear-gradient(110deg,#c9a14a,#d46bff); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">✨ VIVID AURA Custom Art</h3>
                <p>Can't find it on Amazon? Commission a custom, personalized glowing portrait for them from VIVID AURA ART.</p>
                <a href="support.html" class="reveal-btn" style="text-decoration:none; margin-top:15px; display:inline-flex; justify-content:center;">
                    Contact Us ➜
                </a>
            </div>
        `;

        // Inject the new HTML
        resultsSection.innerHTML = resultsHTML;
        
        // Show results
        resultsSection.style.display = 'block';
        
        // Scroll to results smoothly
        setTimeout(() => {
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
        
    }, 1000); 
}
</script>

</body>
</html>
